server:
  port: 8080

spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/roadsafe_mumbai}
    username: ${DATABASE_USERNAME:roadsafe}
    password: ${DATABASE_PASSWORD:roadsafe}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
