server:
  port: 8080

spring:
  application:
    name: roadsafe-mumbai-backend
  profiles:
    active: default
  datasource:
    url: jdbc:h2:mem:roadsafe_mumbai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=YEAR,MONTH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  data-path: classpath:data
